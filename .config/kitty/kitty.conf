# Nothing OS — kitty strict mono
# Same palette as alacritty: bg #000, fg #fff, surface #0a0a0a, dim #6e6e6e
# Red reserved for stderr/errors only.

# ─── Font ──────────────────────────────────────────────────────────────
font_family       JetBrainsMono Nerd Font Light
bold_font         JetBrainsMono Nerd Font
italic_font       JetBrainsMono Nerd Font Light Italic
bold_italic_font  JetBrainsMono Nerd Font Italic
font_size         13.0
adjust_line_height 110%
disable_ligatures never

# ─── Cursor ────────────────────────────────────────────────────────────
cursor_shape      beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 5.0

# ─── Window ────────────────────────────────────────────────────────────
window_padding_width 14
window_border_width 0
hide_window_decorations yes
background_opacity 1.0
dynamic_background_opacity no
remember_window_size  yes
initial_window_width  120c
initial_window_height 36c
confirm_os_window_close 0

# ─── Tabs ──────────────────────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    "{index}·{title}"
active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold
inactive_tab_foreground #6e6e6e
inactive_tab_background #000000
inactive_tab_font_style normal
tab_bar_min_tabs      2
tab_separator         "  "

# ─── URLs / links ──────────────────────────────────────────────────────
url_color   #ffffff
url_style   single
underline_hyperlinks hover

# ─── Bell ──────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# ─── Scrollback ────────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 100

# ─── Mouse ─────────────────────────────────────────────────────────────
mouse_hide_wait 1.5
copy_on_select yes
strip_trailing_spaces always

# ─── Performance ───────────────────────────────────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ─── Colors: strict mono ───────────────────────────────────────────────
foreground            #ffffff
background            #000000
selection_foreground  #000000
selection_background  #ffffff

cursor                #ffffff
cursor_text_color     #000000

# Borders (when decorations are on)
active_border_color   #ffffff
inactive_border_color #1a1a1a
bell_border_color     #d72631

# Marks
mark1_foreground      #000000
mark1_background      #ffffff
mark2_foreground      #000000
mark2_background      #a8a8a8
mark3_foreground      #ffffff
mark3_background      #3a3a3a

# 16-color palette
# normal
color0  #000000
color1  #d72631
color2  #6e6e6e
color3  #a8a8a8
color4  #6e6e6e
color5  #a8a8a8
color6  #a8a8a8
color7  #ffffff
# bright
color8  #3a3a3a
color9  #ff4d57
color10 #a8a8a8
color11 #d0d0d0
color12 #a8a8a8
color13 #d0d0d0
color14 #d0d0d0
color15 #ffffff

# ─── Misc ──────────────────────────────────────────────────────────────
shell_integration enabled
allow_remote_control yes
update_check_interval 0
startup_session none
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# ─── Keybindings (just a couple of conveniences) ───────────────────────
map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_window
map ctrl+shift+q     close_tab
map ctrl+shift+l     next_tab
map ctrl+shift+h     previous_tab
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
