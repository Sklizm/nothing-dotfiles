# Nothing OS — kitty quake-terminal config (loaded by kitty-quake.desktop)
# Inherits the main config, then overrides for transparent dropdown feel.
include kitty.conf

# Transparent dotgrid feel
background_opacity 0.86
background_image    none
dynamic_background_opacity no

# No tab bar — quake is single-pane (tmux handles multi)
tab_bar_style hidden
window_padding_width 18 24

# Faster repaint feel
repaint_delay 6
input_delay   2
sync_to_monitor yes

# Beam cursor only, no blink (quiet vibe)
cursor_blink_interval 0
cursor_shape beam

# Allow remote control so the launcher can preload tmux cleanly
allow_remote_control yes
listen_on unix:/tmp/kitty-quake-%u
