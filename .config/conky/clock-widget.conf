-- Nothing OS — big Ndot clock (top-right)

conky.config = {
    -- Window
    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    background = true,
    update_interval = 1.0,

    -- Position
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 40,
    minimum_width = 480,
    minimum_height = 200,
    maximum_width = 700,

    -- Text
    use_xft = true,
    font = 'Ndot 57:size=72',
    xftalpha = 1.0,
    override_utf8_locale = true,
    text_buffer_size = 2048,
    uppercase = false,
    default_color = 'ffffff',
    default_shade_color = '000000',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    border_inner_margin = 0,
    border_outer_margin = 0,
    no_buffers = true,
};

conky.text = [[
${alignr}${font Ndot 57:size=110}${time %H:%M}${font}
${alignr}${voffset -10}${font Ndot 57:size=22}${color 6e6e6e}${time %A, %d %B}${color}${font}
]];
