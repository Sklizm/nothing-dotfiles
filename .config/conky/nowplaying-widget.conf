-- Nothing OS — now playing (bottom-left)
-- Pulls via playerctl (MPRIS) — works with Spotify, Vesktop, Lollypop, etc.

conky.config = {
    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    background = true,
    update_interval = 2.0,

    alignment = 'bottom_left',
    gap_x = 40,
    gap_y = 40,
    minimum_width = 360,
    minimum_height = 100,
    maximum_width = 500,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=11:style=Light',
    xftalpha = 1.0,
    override_utf8_locale = true,
    default_color = 'ffffff',
    color1 = '6e6e6e',
    color2 = 'a8a8a8',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    border_inner_margin = 0,
    border_outer_margin = 0,
    no_buffers = true,
};

conky.text = [[
${color1}now playing${color}
${font Ndot 57:size=18}${execi 2 playerctl metadata --format '{{title}}' 2>/dev/null || echo "—"}${font}
${voffset -4}${color2}${execi 2 playerctl metadata --format '{{artist}}' 2>/dev/null || echo ""}${color}
${color1}${execi 2 playerctl status 2>/dev/null | tr '[:upper:]' '[:lower:]' || echo "stopped"}  ·  ${execi 5 playerctl metadata --format '{{ duration(position) }} / {{ duration(mpris:length) }}' 2>/dev/null || echo "—"}${color}
]];
