# Nothing OS — tmux config (strict mono)

# --- core ---
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"

# --- vim copy-mode + wayland clipboard ---
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Y   send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# --- pane splits keep cwd ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- visual: strict mono ---
# hairline pane borders
set -g pane-border-style              "fg=#1a1a1a"
set -g pane-active-border-style       "fg=#ffffff"
set -g pane-border-lines              single

# no chromatic activity flash
setw -g monitor-activity off
set  -g visual-activity  off
set  -g visual-bell      off
set  -g bell-action      none

# message / command-prompt
set -g message-style         "bg=#000000,fg=#ffffff"
set -g message-command-style "bg=#000000,fg=#ffffff"
set -g mode-style            "bg=#ffffff,fg=#000000"

# --- status bar (mono, Ndot accents) ---
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#ffffff"

# left: session name in Ndot feel (rendered by terminal font fallback)
set -g status-left-length 40
set -g status-left "#[bg=#000000,fg=#ffffff,bold] ▪ #S #[fg=#1a1a1a]│ "

# right: ISO time + battery %
set -g status-right-length 60
set -g status-right "#[fg=#6e6e6e]#(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%% #[fg=#1a1a1a]│ #[fg=#ffffff]#(date +'%Y-%m-%d %H:%M') #[fg=#6e6e6e]▪ "

# window list
setw -g window-status-separator " "
setw -g window-status-style          "bg=#000000,fg=#6e6e6e"
setw -g window-status-current-style  "bg=#000000,fg=#ffffff,bold"
setw -g window-status-format         " #I·#W "
setw -g window-status-current-format " #I·#W "
setw -g window-status-activity-style "bg=#000000,fg=#a8a8a8"

# clock-mode mono
setw -g clock-mode-colour "#ffffff"
setw -g clock-mode-style 24
